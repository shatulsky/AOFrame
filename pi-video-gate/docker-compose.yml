# - network_mode: host so config.json's `immichBaseUrl: http://localhost:2283`
#   keeps resolving to Immich's own published port on the same host, with
#   no docker-network/DNS rework needed.
# - Only two folders are mounted, not the whole home folder:
#   * /home/pi/pi-video-gate (rw): the service's own folder. config.json
#     (has the Immich API key), confirmed.json, webcam-enabled.json,
#     webcam-state.json, webcam-cache/ and tmp/ all persist across
#     container recreates - nothing here is baked into the image.
#   * /home/pi/immich-app/library (ro): Immich's library. The service
#     only reads originals and transcoded videos; it replaces a video
#     through Immich's own API, never by writing into the library.
# - libraryDir in config.json (/home/pi/immich-app/library) resolves the
#   same way, because the path inside the container equals the host path.
# - Hardening: runs as the owner of the service folder (uid 1000), with all
#   capabilities dropped, a read-only root filesystem, and no way to gain
#   privileges. Change `user` if the folder is owned by another uid.
services:
  pi-video-gate:
    build: .
    container_name: pi-video-gate
    user: "1000:1000"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    network_mode: host
    restart: unless-stopped
    volumes:
      - /home/pi/pi-video-gate:/home/pi/pi-video-gate
      - /home/pi/immich-app/library:/home/pi/immich-app/library:ro
    working_dir: /home/pi/pi-video-gate
    command: node server.js
